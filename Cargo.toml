[package]
name = "option-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
urlencoding = "2.1.3"
libm = "0.2.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

