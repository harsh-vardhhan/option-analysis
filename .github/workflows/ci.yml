name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Cargo cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Rename binary (Unix)
      if: runner.os != 'Windows'
      run: mv target/release/option-analysis target/release/trakbit

    - name: Rename binary (Windows)
      if: runner.os == 'Windows'
      run: mv target/release/option-analysis.exe target/release/trakbit.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trakbit-${{ matrix.os }}
        path: target/release/trakbit*
