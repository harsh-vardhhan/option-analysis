name: CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    # This ensures everything runs on your M4 Pro
    runs-on: self-hosted 
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin      # Native M4 Pro
            os_name: macos-latest
            ext: ""
          - target: x86_64-pc-windows-gnu     # Windows
            os_name: windows-latest
            ext: ".exe"
          - target: x86_64-unknown-linux-gnu  # Linux (Intel)
            os_name: ubuntu-latest
            ext: ""

    steps:
    - uses: actions/checkout@v4

    # Caching isn't as strictly necessary on a local runner, but still speeds up builds
    - name: Set up Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    # The runner will use your system's Homebrew installation of Zig
    - name: Ensure cargo-zigbuild
      run: cargo install cargo-zigbuild

    # Tell Rust about the target we are cross-compiling
    - name: Add Rust target
      run: rustup target add ${{ matrix.target }}

    # Build the project using cargo-zigbuild!
    - name: Build with Zig
      run: cargo zigbuild --release --target ${{ matrix.target }} --verbose

    - name: Rename binary
      run: mv -f target/${{ matrix.target }}/release/option-analysis${{ matrix.ext }} target/${{ matrix.target }}/release/trakbit${{ matrix.ext }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trakbit-${{ matrix.os_name }}
        path: target/${{ matrix.target }}/release/trakbit*

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Upload to S3
      run: |
        aws s3 cp target/${{ matrix.target }}/release/trakbit${{ matrix.ext }} s3://${{ secrets.S3_BUCKET_NAME }}/builds/${{ matrix.os_name }}/trakbit${{ matrix.ext }} --acl public-read
