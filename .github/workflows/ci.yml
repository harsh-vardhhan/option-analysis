name: CI

on:
  push:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Cargo cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Rename binary (Unix)
      if: runner.os != 'Windows'
      run: mv -f target/release/option-analysis target/release/trakbit

    - name: Rename binary (Windows)
      if: runner.os == 'Windows'
      run: mv -Force target/release/option-analysis.exe target/release/trakbit.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trakbit-${{ matrix.os }}
        path: target/release/trakbit*

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Upload to S3 (Unix)
      if: runner.os != 'Windows'
      run: |
        aws s3 cp target/release/trakbit s3://${{ secrets.S3_BUCKET_NAME }}/builds/${{ matrix.os }}/trakbit --acl public-read

    - name: Upload to S3 (Windows)
      if: runner.os == 'Windows'
      run: |
        aws s3 cp target/release/trakbit.exe s3://${{ secrets.S3_BUCKET_NAME }}/builds/${{ matrix.os }}/trakbit.exe --acl public-read
