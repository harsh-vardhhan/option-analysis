name: CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os_name }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin      # Native M4 Pro
            os_name: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc    # Windows
            os_name: windows-latest
            ext: ".exe"
          - target: x86_64-unknown-linux-gnu  # Linux (Intel)
            os_name: ubuntu-latest
            ext: ""

    steps:
    - uses: actions/checkout@v4

    # Caching isn't as strictly necessary on a local runner, but still speeds up builds
    - name: Set up Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    # Tell Rust about the target we are compiling
    - name: Add Rust target
      run: rustup target add ${{ matrix.target }}

    # Build the project using standard cargo natively on the GitHub runner
    - name: Build with Cargo
      run: cargo build --release --target ${{ matrix.target }} --verbose

    - name: Rename binary
      shell: bash
      run: mv -f target/${{ matrix.target }}/release/option-analysis${{ matrix.ext }} target/${{ matrix.target }}/release/trakbit${{ matrix.ext }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trakbit-${{ matrix.os_name }}
        path: target/${{ matrix.target }}/release/trakbit*

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          # From macos-latest artifact, rename trakbit to trakbit-macos
          cp artifacts/trakbit-macos-latest/trakbit release-assets/trakbit-macos
          # From ubuntu-latest artifact, rename trakbit to trakbit-linux
          cp artifacts/trakbit-ubuntu-latest/trakbit release-assets/trakbit-linux
          # From windows-latest artifact, copy trakbit.exe
          cp artifacts/trakbit-windows-latest/trakbit.exe release-assets/trakbit.exe
          ls -la release-assets

      - name: Update latest tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -f latest
          git push --force origin latest

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: "Automated release of the latest build from the master branch."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/trakbit-macos
            release-assets/trakbit-linux
            release-assets/trakbit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This job satisfies the required status check in your branch ruleset
  pull_request:
    name: pull_request
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "All matrix builds passed successfully!"
